[workspace]
resolver = "2"
members = [
    "paramecia-engine",
]
exclude = ["backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nicksenger/paramecia"
authors = ["Nick Senger"]

[workspace.dependencies]
# Internal crates
paramecia-model = { path = "backend/paramecia-model" }
paramecia-opt = { path = "backend/paramecia-opt" }

# Async runtime
tokio = { version = "1.44", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Logging and errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.16", features = ["v4"] }
rand = "0.9"

# Parallelism
rayon = "1.10"

# ML
tokenizers = { version = "0.21", default-features = false }
hf-hub = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
type_complexity = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
