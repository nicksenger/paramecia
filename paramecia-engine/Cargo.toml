[package]
name = "paramecia-engine"
description = "Model engine for paramecia"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal
paramecia-model = { workspace = true }
paramecia-opt = { workspace = true }

# Shared deps
tokio = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
tokenizers = { workspace = true, features = ["onig"] }
hf-hub = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { version = "1.44", features = ["rt"] }

[features]
default = []
accelerate = ["paramecia-model/accelerate", "paramecia-opt/accelerate"]
cuda = ["paramecia-model/cuda", "paramecia-opt/cuda"]
metal = ["paramecia-model/metal", "paramecia-opt/metal"]
vulkan = ["paramecia-model/vulkan", "paramecia-opt/vulkan"]
qwen3next_80b_a3b = [
    "paramecia-model/qwen3next_80b_a3b",
    "paramecia-opt/qwen3next_80b_a3b",
]
qwen35moe_35b_a3b = [
    "paramecia-model/qwen35moe_35b_a3b",
    "paramecia-opt/qwen35moe_35b_a3b",
]
qwen35moe_122b_a10b = [
    "paramecia-model/qwen35moe_122b_a10b",
    "paramecia-opt/qwen35moe_122b_a10b",
]
qwen35moe_397b_a17b = [
    "paramecia-model/qwen35moe_397b_a17b",
    "paramecia-opt/qwen35moe_397b_a17b",
]
qwen35_0p8b = [
    "paramecia-model/qwen35_0p8b",
    "paramecia-opt/qwen35_0p8b",
]
qwen35_2b = [
    "paramecia-model/qwen35_2b",
    "paramecia-opt/qwen35_2b",
]
qwen35_4b = [
    "paramecia-model/qwen35_4b",
    "paramecia-opt/qwen35_4b",
]
qwen35_9b = [
