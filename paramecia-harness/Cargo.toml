[package]
name = "paramecia-harness"
description = "Types, configuration, and logic for paramecia interactive agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
paramecia-text = { workspace = true }
paramecia-tools = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
once_cell = { workspace = true }

whoami = "1.5"

[dev-dependencies]
tempfile = "3"

[features]
default = []
accelerate = ["paramecia-text/accelerate"]
cuda = ["paramecia-text/cuda"]
metal = ["paramecia-text/metal"]
qwen3next_80b_a3b = ["paramecia-text/qwen3next_80b_a3b"]
qwen35moe_35b_a3b = ["paramecia-text/qwen35moe_35b_a3b"]
qwen35moe_122b_a10b = ["paramecia-text/qwen35moe_122b_a10b"]
qwen35moe_397b_a17b = ["paramecia-text/qwen35moe_397b_a17b"]
qwen35_0p8b = ["paramecia-text/qwen35_0p8b"]
qwen35_2b = ["paramecia-text/qwen35_2b"]
qwen35_4b = ["paramecia-text/qwen35_4b"]
qwen35_9b = ["paramecia-text/qwen35_9b"]
qwen35_27b = ["paramecia-text/qwen35_27b"]
