[package]
name = "paramecia-host"
description = "Wasm control modules for paramecia"
version.workspace = true
edition.workspace = true

[dependencies]
# WASM runtime (component-model-async enables future<T>/stream<T> in WIT)
wasmtime = { version = "41.0.3", features = ["component-model", "component-model-async", "async"] }
wasmtime-wasi = { version = "41.0.3", features = ["p3"] }

# Internal
paramecia-engine = { path = "../paramecia-engine" }
paramecia-bridge = { workspace = true }

# Shared deps
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hf-hub = { workspace = true }
uuid = { workspace = true }

[features]
default = []
cuda = ["paramecia-engine/cuda"]
metal = ["paramecia-engine/metal"]
vulkan = ["paramecia-engine/vulkan"]
qwen3next_80b_a3b = [
    "paramecia-engine/qwen3next_80b_a3b",
]
qwen35moe_35b_a3b = [
    "paramecia-engine/qwen35moe_35b_a3b",
]
qwen35moe_122b_a10b = [
    "paramecia-engine/qwen35moe_122b_a10b",
]
qwen35moe_397b_a17b = [
    "paramecia-engine/qwen35moe_397b_a17b",
]
qwen35_0p8b = [
    "paramecia-engine/qwen35_0p8b",
]
qwen35_2b = [
    "paramecia-engine/qwen35_2b",
]
qwen35_4b = [
    "paramecia-engine/qwen35_4b",
]
qwen35_9b = [
    "paramecia-engine/qwen35_9b",
]
qwen35_27b = [
    "paramecia-engine/qwen35_27b",
]

[build-dependencies]
paramecia-wit = { path = "../paramecia-wit" }
